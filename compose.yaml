services:
  renderer-image:
    profiles: [build]
    build:
      context: .
      dockerfile: renderer/Dockerfile
    image: instagram-site-renderer:1.0.0
    network_mode: none
    entrypoint: ["node", "--version"]
  worker:
    build: .
    image: instagram-site-worker:1.0.0
    restart: "no"
    env_file: .env
    environment:
      DATA_DIR: /data
      HOST: 0.0.0.0
    ports: ["127.0.0.1:8787:8787"]
    volumes:
      - worker-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs: [/tmp:size=64m,noexec,nosuid,nodev]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  worker-data:
